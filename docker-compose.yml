services:

  etcd1:
    build:
      dockerfile: Dockerfile.etcd
    container_name: etcd1
    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-cluster-etcd
    volumes:
      - etcd1_data:/var/lib/etcd
    networks:
      - pgnet

  etcd2:
    build:
      dockerfile: Dockerfile.etcd
    container_name: etcd2
    environment:
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-cluster-etcd
    volumes:
      - etcd2_data:/var/lib/etcd
    networks:
      - pgnet

  etcd3:
    build:
      dockerfile: Dockerfile.etcd
    container_name: etcd3
    environment:
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-cluster-etcd
    volumes:
      - etcd3_data:/var/lib/etcd
    networks:
      - pgnet

  pg-node1:
    build: .
    container_name: pg-node1
    environment:
      PATRONI_NAME: pg-node1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node1:5432
    volumes:
      - pg_node1_data:/var/lib/pgsql/18/data
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
    networks:
      - pgnet
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "patroni:patroni", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  pg-node2:
    build: .
    container_name: pg-node2
    environment:
      PATRONI_NAME: pg-node2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node2:5432
    volumes:
      - pg_node2_data:/var/lib/pgsql/18/data
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
    networks:
      - pgnet
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "patroni:patroni", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
  
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pgnet
    depends_on:
      - flask-app

  flask-app:
      build: ./app
      container_name: flask-app
      environment:
        DATABASE_URL: postgresql://postgres:postgres@pg-node1:5432,pg-node2:5432/postgres?target_session_attrs=read-write
      networks:
        - pgnet
      depends_on:
        pg-node1:
          condition: service_healthy
        pg-node2:
          condition: service_healthy
  
volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  pg_node1_data:
  pg_node2_data:

networks:
  pgnet:
    driver: bridge
